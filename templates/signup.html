<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - EduAttend</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="../static/css/dashboard.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
  <style>
    .role-nav-tab {
      flex: 1;
      padding: 0.55rem 0.5rem;
      border: 1px solid var(--border-color);
      background-color: #F8FAFC;
      color: #475569;
      font-weight: 600;
      font-size: 0.86rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .role-nav-tab:hover {
      background-color: #EBF3FC;
      color: var(--primary-color);
      border-color: #CBD5E1;
    }
    .role-nav-tab.active {
      background-color: var(--primary-color);
      color: #FFFFFF;
      border-color: var(--primary-color);
      box-shadow: 0 2px 6px rgba(30, 86, 160, 0.3);
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-4" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7 col-xl-6">
        
        <!-- Brand Header with Dark Mode Toggle -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <a class="app-brand" href="landing.html">
            <div class="app-brand-icon">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <div>
              <span class="app-brand-text">EduAttend</span>
              <span class="app-brand-sub">Smart Attendance System</span>
            </div>
          </a>
          <button type="button" class="btn-theme-toggle" title="Toggle Dark/Light Mode">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
        </div>

        <div class="text-center mb-3">
          <h4 class="fw-bold text-dark mb-1">Create an EduAttend Account</h4>
          <p class="text-muted small">Select your entity role below to proceed with registration.</p>
        </div>

        <!-- Signup Card -->
        <div class="card border shadow-sm rounded-4 bg-white p-4">

          <!-- ENTITY SELECTOR AT TOP -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-secondary text-uppercase letter-spacing-1 d-block text-center mb-2">
              Select Your Role / Entity
            </label>
            <div class="d-flex gap-2" id="signupRoleTabs">
              <button type="button" class="role-nav-tab" data-role="admin" onclick="switchSignupRole('admin')">
                <i class="bi bi-shield-lock"></i> Admin
              </button>
              <button type="button" class="role-nav-tab active" data-role="teacher" onclick="switchSignupRole('teacher')">
                <i class="bi bi-person-video3"></i> Teacher
              </button>
              <button type="button" class="role-nav-tab" data-role="student" onclick="switchSignupRole('student')">
                <i class="bi bi-mortarboard"></i> Student
              </button>
              <button type="button" class="role-nav-tab" data-role="parent" onclick="switchSignupRole('parent')">
                <i class="bi bi-people"></i> Parent
              </button>
            </div>
          </div>

          <form id="signupForm" onsubmit="handleSignupSubmit(event)">
            <!-- CSRF Token Placeholder for Django -->
            <!-- {% csrf_token %} -->

            <!-- Common Fields: Full Name & Mobile/Email -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-secondary" id="nameLabel">Full Name *</label>
                <input type="text" class="form-control" id="nameInput" placeholder="e.g. Sunita Devi" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-secondary" id="contactLabel">Official Email Address *</label>
                <input type="email" class="form-control" id="contactInput" placeholder="sunita@school.gov.in" required>
              </div>
            </div>

            <!-- Role-Specific Dynamic Fields -->
            <div id="roleSpecificFields" class="mb-3">
              <!-- Admin Dynamic Fields -->
              <div id="fields-admin" class="d-none">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">School UDISE Code *</label>
                    <input type="text" class="form-control" placeholder="e.g. 09280104502">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">School / Institution Name *</label>
                    <input type="text" class="form-control" placeholder="Govt High School Rampur">
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold text-secondary">Designation *</label>
                    <input type="text" class="form-control" placeholder="Principal / Headmaster">
                  </div>
                </div>
              </div>

              <!-- Teacher Dynamic Fields -->
              <div id="fields-teacher">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Teacher Registration ID *</label>
                    <input type="text" class="form-control" placeholder="e.g. TCH-2026-08">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Primary Assigned Class *</label>
                    <select class="form-select">
                      <option value="8A">Class 8th - Section A</option>
                      <option value="9B">Class 9th - Section B</option>
                      <option value="7A">Class 7th - Section A</option>
                      <option value="10A">Class 10th - Section A</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold text-secondary">School Authorization Code *</label>
                    <input type="password" class="form-control" placeholder="Provided by school principal">
                  </div>
                </div>
              </div>

              <!-- Student Dynamic Fields -->
              <div id="fields-student" class="d-none">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Class & Section *</label>
                    <select class="form-select">
                      <option value="8A">Class 8th - Section A</option>
                      <option value="9B">Class 9th - Section B</option>
                      <option value="7A">Class 7th - Section A</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Roll Number *</label>
                    <input type="text" class="form-control" placeholder="e.g. 01">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Admission / Enrollment ID *</label>
                    <input type="text" class="form-control" placeholder="e.g. STU-2026-001">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Date of Birth *</label>
                    <input type="date" class="form-control" value="2012-05-15">
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold text-secondary">Face Embedding Photo Reference (Optional)</label>
                    <input type="file" class="form-control" accept="image/*">
                    <small class="text-muted">A clear front portrait photo used for facial recognition attendance.</small>
                  </div>
                </div>
              </div>

              <!-- Parent Dynamic Fields -->
              <div id="fields-parent" class="d-none">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Ward / Child Full Name *</label>
                    <input type="text" class="form-control" placeholder="e.g. Aarav Sharma">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-semibold text-secondary">Child's Admission / Roll ID *</label>
                    <input type="text" class="form-control" placeholder="e.g. STU-2026-001">
                  </div>
                  <div class="col-12">
                    <label class="form-label small fw-semibold text-secondary">SMS Alert Language Preference</label>
                    <select class="form-select">
                      <option value="hi-en" selected>Hindi & English (Bilingual)</option>
                      <option value="hi">Hindi</option>
                      <option value="en">English</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- Password Fields -->
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-secondary">Create Password *</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="newPassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold text-secondary">Confirm Password *</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirmPassword">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
              <label class="form-check-label small text-secondary" for="termsCheck">
                I agree to the <a href="#" class="text-decoration-none">EduAttend Privacy Policy</a> & educational data usage guidelines.
              </label>
            </div>

            <!-- Submit Registration Button -->
            <button type="submit" id="btnSignupSubmit" class="btn btn-primary w-100 py-2 fw-semibold mb-2">
              <span id="signupSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
              <span id="signupBtnText">Complete Registration & Sign Up</span>
            </button>

            <!-- Already Have Account Link -->
            <div class="text-center mt-3 pt-2 border-top">
              <span class="text-muted small">Already have an account?</span>
              <a href="login.html" class="fw-semibold small ms-1 text-decoration-none">Sign In</a>
            </div>

          </form>

        </div>

        <div class="text-center mt-3">
          <a href="landing.html" class="text-muted small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Back to EduAttend Home
          </a>
        </div>

      </div>
    </div>
  </div>

  <div class="toast-container" id="globalToastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/main.js"></script>
  <script>
    let activeRole = 'teacher';

    const roleInfo = {
      admin: {
        banner: 'Registering as <strong>School Administrator</strong> — Requires school UDISE code validation.',
        namePlaceholder: 'e.g. Dr. Rajesh Verma',
        contactLabel: 'Official Institutional Email *',
        contactPlaceholder: 'principal@school.gov.in',
        targetDashboard: 'admin/dashboard.html'
      },
      teacher: {
        banner: 'Registering as <strong>Teacher</strong> — Requires school verification code or UDISE endorsement.',
        namePlaceholder: 'e.g. Sunita Devi',
        contactLabel: 'Official Email Address *',
        contactPlaceholder: 'sunita@school.gov.in',
        targetDashboard: 'teacher/dashboard.html'
      },
      student: {
        banner: 'Registering as <strong>Student</strong> — Linked to your school admission number.',
        namePlaceholder: 'e.g. Aarav Sharma',
        contactLabel: 'Student Email or Mobile *',
        contactPlaceholder: 'student.aarav@school.gov.in',
        targetDashboard: 'student/dashboard.html'
      },
      parent: {
        banner: 'Registering as <strong>Parent / Guardian</strong> — Receives real-time SMS attendance broadcasts.',
        namePlaceholder: 'e.g. Manoj Sharma',
        contactLabel: 'Primary Mobile Number (for SMS Alerts) *',
        contactPlaceholder: '+91 98765 43210',
        targetDashboard: 'parent/dashboard.html'
      }
    };

    function switchSignupRole(role) {
      activeRole = role;

      // Update Tab Styles
      document.querySelectorAll('#signupRoleTabs .role-nav-tab').forEach(tab => {
        if (tab.getAttribute('data-role') === role) tab.classList.add('active');
        else tab.classList.remove('active');
      });

      // Update Labels
      const info = roleInfo[role];
      document.getElementById('nameInput').placeholder = info.namePlaceholder;
      document.getElementById('contactLabel').innerText = info.contactLabel;
      document.getElementById('contactInput').placeholder = info.contactPlaceholder;

      // Toggle Dynamic Field Sections
      ['admin', 'teacher', 'student', 'parent'].forEach(r => {
        const el = document.getElementById(`fields-${r}`);
        if (el) {
          if (r === role) el.classList.remove('d-none');
          else el.classList.add('d-none');
        }
      });

      showToast('Role Switched', `Switched registration form to ${role.toUpperCase()}`, 'info');
    }

    function handleSignupSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      
      if (p1 !== p2) {
        alert('Passwords do not match. Please re-enter.');
        return;
      }

      const spinner = document.getElementById('signupSpinner');
      const text = document.getElementById('signupBtnText');
      const btn = document.getElementById('btnSignupSubmit');

      spinner.classList.remove('d-none');
      text.innerText = 'Creating Account...';
      btn.disabled = true;

      setTimeout(() => {
        showToast('Registration Successful', `Welcome to EduAttend! Directing to your ${activeRole.toUpperCase()} dashboard...`, 'success');
        setTimeout(() => {
          window.location.href = roleInfo[activeRole].targetDashboard;
        }, 800);
      }, 1000);
    }

    // Auto-detect role from URL param if available (e.g. signup.html?role=student)
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const paramRole = urlParams.get('role');
      if (paramRole && roleInfo[paramRole]) {
        switchSignupRole(paramRole);
      }
    });
  </script>
</body>
</html>

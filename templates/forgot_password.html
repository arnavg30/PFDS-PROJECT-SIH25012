<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EduAttend</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="../static/css/dashboard.css">
  <link rel="stylesheet" href="../static/css/responsive.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-4" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        
        <div class="text-center mb-4">
          <a class="app-brand justify-content-center mb-2" href="landing.html">
            <div class="app-brand-icon">
              <i class="bi bi-mortarboard-fill"></i>
            </div>
            <div>
              <span class="app-brand-text">EduAttend</span>
              <span class="app-brand-sub">Smart Attendance for Every School</span>
            </div>
          </a>
          <h4 class="fw-bold text-dark mt-3 mb-1">Forgot Password?</h4>
          <p class="text-muted small">Enter your verified email or School ID to receive a secure recovery code.</p>
        </div>

        <div class="card border shadow-sm rounded-4 bg-white p-4">
          
          <div id="resetSuccessAlert" class="alert alert-success py-2 px-3 small d-none" role="alert">
            <i class="bi bi-check-circle-fill me-1"></i> Recovery instructions sent to your email! Check your inbox or SMS.
          </div>

          <form id="forgotPasswordForm" onsubmit="handleResetSubmit(event)">
            <div class="mb-3">
              <label for="recoveryInput" class="form-label fw-semibold text-secondary small">Email or Registration ID</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="text" class="form-control border-start-0" id="recoveryInput" placeholder="e.g. teacher.sunita@school.gov.in" required>
              </div>
            </div>

            <button type="submit" id="btnResetSubmit" class="btn btn-primary w-100 py-2 fw-semibold">
              <span id="resetSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
              <span id="resetBtnText">Send Reset Link</span>
            </button>
          </form>

          <div class="border-top mt-4 pt-3 text-center">
            <span class="text-muted small">Remembered your credentials?</span>
            <a href="login.html" class="fw-semibold small ms-1 text-decoration-none">Back to Sign In</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function handleResetSubmit(e) {
      e.preventDefault();
      const spinner = document.getElementById('resetSpinner');
      const text = document.getElementById('resetBtnText');
      const alertBox = document.getElementById('resetSuccessAlert');

      spinner.classList.remove('d-none');
      text.innerText = 'Transmitting...';

      setTimeout(() => {
        spinner.classList.add('d-none');
        text.innerText = 'Link Sent';
        alertBox.classList.remove('d-none');
      }, 700);
    }
  </script>
</body>
</html>
